# Playwright E2E, axe and visual baselines in the Playwright image (PRD 14.4-14.5, 15.2).
# To save Actions minutes it runs on main, on PRs that are ready for review (not drafts), and on
# draft PRs labelled `e2e`. Open PRs as drafts while iterating; mark ready (or add `e2e`) to run it.
name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_call:
  workflow_dispatch:
    inputs:
      grep:
        description: Only run tests matching this pattern
        required: false
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    if: >-
      github.event_name != 'pull_request' ||
      (
        (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
        (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'e2e'))
      )
    # Job-level, so a skipped run (a PR labelled with something other than `e2e`) never cancels a
    # running one; a new push still cancels the older run of the same PR.
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Throwaway secrets for this run
        run: |
          token=$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")
          echo "::add-mask::$token"
          echo "E2E_TOKEN=$token" >> "$GITHUB_ENV"
          node scripts/gen-secrets.mjs --dev-vars app/.dev.vars --env local --e2e-token "$token"
      - name: Build
        run: pnpm build
      - name: Place .dev.vars next to the built Worker config
        run: |
          for cfg in $(find app/dist -name wrangler.json -not -path '*/node_modules/*'); do cp app/.dev.vars "$(dirname "$cfg")/.dev.vars"; done
      - name: Playwright
        run: pnpm --filter @fs/e2e exec playwright test ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}
      - name: Playwright (split hosts, OWNER_HOST set)
        if: ${{ !cancelled() }}
        run: |
          for cfg in $(find app/dist -name wrangler.json -not -path '*/node_modules/*'); do
            printf '\nOWNER_HOST=owner.localhost:8787\n' >> "$(dirname "$cfg")/.dev.vars"
          done
          E2E_SPLIT=1 pnpm --filter @fs/e2e exec playwright test
      - name: Upload report, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          retention-days: 7
          if-no-files-found: ignore
          path: |
            e2e/playwright-report
            e2e/test-results
