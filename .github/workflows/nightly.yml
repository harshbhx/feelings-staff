# Nightly at 02:00 IST (PRD 15.2): dependency audit every night; the full E2E suite only when main
# changed in the last 24 hours (saves Actions minutes).
name: nightly

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: changes
        run: echo "changed=$([ -n "$(git log --since='24 hours ago' --oneline)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  e2e:
    needs: audit
    if: needs.audit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/e2e.yml
