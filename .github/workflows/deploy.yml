# Production deploy after ci and e2e pass on main (PRD 15.2). Needs CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID; without them it prints a notice. Go-live steps: docs/deploy.md.
name: deploy

on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare credentials
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; production deploy skipped (docs/deploy.md)."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require a green ci run for this commit
        if: env.HAS_TOKEN == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=${{ github.event.workflow_run.head_sha }}
          concl=$(gh run list -R ${{ github.repository }} --workflow ci --commit "$sha" --json conclusion --jq '.[0].conclusion')
          test "$concl" = "success" || { echo "ci is '$concl' for $sha"; exit 1; }
      - uses: pnpm/action-setup@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: env.HAS_TOKEN == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: env.HAS_TOKEN == 'true'
        run: pnpm build
      - name: Back up the production database
        if: env.HAS_TOKEN == 'true'
        working-directory: app
        run: pnpm exec wrangler d1 export fbc-staff --remote --output "../d1-backup-$(date +%Y%m%d-%H%M).sql"
      - uses: actions/upload-artifact@v4
        if: env.HAS_TOKEN == 'true'
        with:
          name: d1-backup
          retention-days: 30
          path: d1-backup-*.sql
      - name: Apply migrations
        if: env.HAS_TOKEN == 'true'
        working-directory: app
        run: pnpm exec wrangler d1 migrations apply fbc-staff --remote
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        working-directory: app
        run: pnpm exec wrangler deploy
      - name: Smoke
        if: env.HAS_TOKEN == 'true'
        run: |
          base="${{ vars.PRODUCTION_URL || 'https://staff.feelingsbeautycare.in' }}"
          curl -fsS "$base/api/v1/health"
          curl -fsS "$base/api/v1/config" > /dev/null
          curl -fsS -o /dev/null "$base/"
      - name: Tag the release
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "Harsh Bhanushali"
          git config user.email "bhanushaliharsh434@gmail.com"
          n=$(git tag -l "v$(date +%Y.%m.%d)-*" | wc -l)
          tag="v$(date +%Y.%m.%d)-$((n + 1))"
          git tag "$tag" && git push origin "$tag"
